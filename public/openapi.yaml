openapi: 3.0.3
info:
  title: 中亚五国日报 Word 稿上传与校核
  description: |
    接收 ChatGPT 产出的五国日报 Word 稿（.docx），解析成结构化稿件并做确定性校核，
    返回「修正清单」——该清单可直接回喂给 ChatGPT 让它逐条修改。

    ⚠️ 本接口**只校核、不改稿**（稿子由人过目）。
    ⚠️ 校核依赖原文：若每条带了「原文关键句」，量级闸与机构名对照才生效。
  version: 1.0.0
servers:
  - url: https://central-asia-news-307705-12-1480606601.sh.run.tcloudbase.com
    description: 微信云托管（生产）
security:
  - ingestSecret: []
paths:
  /api/word-ingest:
    post:
      operationId: ingestWordDaily
      summary: 上传五国日报 Word 稿并做校核
      description: |
        上传 .docx ⇒ 返回解析预览、校核报告、以及可直接回喂的修正清单（Markdown）。
        默认**不落库**；确认无误后再带 persist=1 落库。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fileBase64:
                  type: string
                  description: .docx 文件的 base64（不含 data: 前缀）
                date:
                  type: string
                  description: 稿件日期 YYYY-MM-DD（可选，默认今天）
                persist:
                  type: string
                  description: 传 "1" 才落库；默认只校核
              required: [fileBase64]
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: .docx 文件
                date:
                  type: string
                persist:
                  type: string
      responses:
        '200':
          description: 解析与校核结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  parsed:
                    type: object
                    properties:
                      articles: { type: integer }
                      warnings: { type: array, items: { type: string } }
                  audit:
                    type: object
                    properties:
                      total: { type: integer }
                      findings: { type: array, items: { type: object } }
                  fixList:
                    type: string
                    description: Markdown 修正清单，可直接贴回 ChatGPT
                  persisted: { type: object, nullable: true }
        '400': { description: 请求格式错误 }
        '401': { description: 缺少或错误的 INGEST_SECRET }
        '422': { description: 一个稿件都没解析出来（格式不对） }
  /api/word-package:
    post:
      operationId: ingestWordPackage
      summary: 提交五国完整稿包（正文含配图 + 版本号）
      description: |
        ChatGPT 侧「采集 + 写作 + 审稿 + 配图 + 排版」完成后的**成品包**入口。
        ★ **五国必须齐**（缺任一国 ⇒ 409，不提交）⇒ 避免半套稿子进生产。
        ★ 配图请**直接写进 bodyHtml 的 `<img src="https://…">`** ⇒ 旧推送链路会照旧
        把图上传到微信素材库并换成 CDN 地址（零改动）。
        ★ 幂等：同版本 + 同国 + 同标题 ⇒ 不重复插入。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                version:
                  type: string
                  description: 版本号（幂等键），如 2026-11-07
                countries:
                  type: object
                  description: 五国稿件，键为 kz/uz/kg/tj/az
                  additionalProperties:
                    type: object
                    properties:
                      title: { type: string }
                      summary: { type: string }
                      bodyHtml:
                        type: string
                        description: 正文 HTML（**含 <img src>** ⇒ 配图走这里）
                      sourceName: { type: string }
                      sourceUrl: { type: string }
                      coverUrl: { type: string }
              required: [version, countries]
      responses:
        '200':
          description: 已提交
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  version: { type: string }
                  inserted: { type: integer }
                  skipped: { type: integer }
                  byCountry: { type: object }
        '401': { description: 缺少或错误的 INGEST_SECRET }
        '409': { description: 五国未齐 ⇒ 按约定不提交 }
components:
  securitySchemes:
    ingestSecret:
      type: apiKey
      in: header
      name: X-Ingest-Secret
