name: plan-b-offline-regression

on:
  pull_request:
    paths:
      - 'ops/plan-b/**'
      - 'scripts/test_plan_b_*.py'
      - 'src/lib/reviewed-wechat.ts'
      - 'src/lib/reviewed-wechat-transport.ts'
      - 'src/lib/plan-b-runtime-checks.ts'
      - 'src/lib/reviewed-database-delivery.ts'
      - 'scripts/prepare-reviewed-database-delivery.ts'
      - 'scripts/test-reviewed-database-delivery.ts'
      - 'scripts/test-plan-b-wechat-probe.ts'

permissions:
  contents: read

jobs:
  offline-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install parser dependency
        run: python -m pip install lxml
      - name: Verify bounded queue and evidence invariants
        run: python -m unittest discover -s scripts -p 'test_plan_b_bounded_queues.py' -v
      - name: Verify incident real-route regressions
        run: python -m unittest discover -s scripts -p 'test_plan_b_real_queues.py' -v
      - name: Verify coverage gate contracts
        run: python -m unittest discover -s scripts -p 'test_plan_b_coverage.py' -v
      - name: Verify discovery classification contracts
        run: python -m unittest discover -s scripts -p 'test_work_discovery.py' -v
      - name: Verify publisher publication evidence and editorial counts
        env:
          PYTHONPATH: ops/plan-b:scripts
        run: python -m unittest test_work_sources test_work_quantity

  offline-handoff-typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Offline freeze and signed-coverage contract
        run: pnpm exec tsx scripts/test-plan-b-coverage.ts
      - name: Offline bounded recovery and checkpoint contract
        run: pnpm exec tsx scripts/test-plan-b-bounded-recovery.ts
      - name: Offline database exchange and manual authorization contract
        run: pnpm exec tsx scripts/test-plan-b-database-exchange.ts
      - name: Offline signed recovery windows and duplicate prevention
        run: pnpm exec tsx scripts/test-reviewed-database-delivery.ts
      - name: Offline WeChat readback transport and duplicate prevention
        run: pnpm exec tsx scripts/test-plan-b-wechat-probe.ts
