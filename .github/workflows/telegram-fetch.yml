# Telegram 抓取（跑在 GitHub Actions 上，出口在境外）
#
# ## 为什么需要它
#
# 微信云托管在大陆 ⇒ 连不上 `t.me`（实测直连 254ms 就 `fetch failed`）、
# 也连不上 `*.workers.dev` ⇒ ⇒ **12 个 Telegram 频道（占配置源的 34%）一条都进不来**。
# 而 **GitHub 的 runner 在境外** ⇒ 实测能直连 t.me 并抓到 **208 条/轮**。
#
# ## 只需要两个 Secret（仓库 Settings → Secrets and variables → Actions）
#
#   INGEST_URL     = https://<服务域名>/api/telegram-ingest
#   INGEST_SECRET  = 与云托管环境变量 TELEGRAM_INGEST_SECRET **一致**的那串
#
# ⚠️ 仓库**必须是公开的** ⇒ 私有仓库的 Actions 免费额度不成立（每月 2000 分钟是公开仓库的额度）。
#    本仓库是公开的 ⇒ 每天一次、每次约 2 分钟 ⇒ 一年约 1095 分钟 ⇒ 额度充足。
#
# ## ⭐ 时间为什么定在北京 **18:00**（UTC 10:00）—— 原来定 02:00，**实测延迟了 3.9 小时**
#
# 云托管那一轮是**北京 04:00** ⇒ 抓取必须**在它之前**完成并入库，
# 否则当天的日报就用不上这些稿子。
#
# ⚠️⚠️ **GitHub 的定时任务延迟可以远大于官方说的 5–30 分钟。**
# ⇒ **实测（2026-10-28）**：cron 定在 UTC 18:00（北京 02:00），
# ⇒ 实际 **21:52Z（北京 05:52）才跑** ⇒ **延迟 3.9 小时** ⇒
# ⇒ 而云托管那轮 04:00 起跑、05:48 抓完 ⇒ ⇒ **它跑在抓取之后**
# ⇒ ⇒ **当天的日报一篇 Telegram 稿子都没用上**（库里 t.me 来源 = 0 篇）。
#
# ⇒ ⇒ 所以**提前到 UTC 10:00（北京 18:00）**：留 **10 小时余量** ⇒
# ⇒ 即使延迟 4 小时（22:00）也仍在 04:00 之前 ⇒ ⇒ **当天能用上**。
# ⇒ ⇒ 而且 ingest 接口是**幂等 + 立即返回**（202 已排队、后台翻译）⇒
# ⇒ ⇒ **它什么时候跑都不影响正确性**，只影响「能不能赶上当天」。
#
# ⚠️ 用的是 **UTC 的 cron**（GitHub 不按时区）⇒ 北京 18:00 = UTC 10:00。

name: fetch-telegram

on:
  schedule:
    # UTC 10:00 = 北京 18:00（比云托管那一轮早 10 小时，留足 GitHub cron 的延迟余量）
    - cron: '0 10 * * *'
  # 允许手动触发（调试 / 补跑用）
  workflow_dispatch:

concurrency:
  # 同一时间只跑一个（避免两次抓取互相重复推送）
  group: fetch-telegram
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ⚠️ 只装跑这个脚本需要的东西（`tsx` + 类型）⇒ 不装全仓库依赖 ⇒ 快且省额度。
      # ⚠️ `--ignore-scripts` 是必要的：仓库里有 postinstall 之类会跑构建的脚本。
      - name: 安装依赖
        run: npm install --no-save --ignore-scripts tsx typescript

      - name: 抓取并送入云托管
        env:
          INGEST_URL: ${{ secrets.INGEST_URL }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
        run: npx tsx scripts/fetch-telegram.ts
